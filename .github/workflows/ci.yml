name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ações fixadas por SHA de commit (entrega infra-1 do backend, I12); o comentário diz a versão.
permissions:
  contents: read

env:
  # Mesma versão e digest validados localmente; imagem em vez da trivy-action, que já teve tags sequestradas.
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      API_INTERNAL_URL: http://localhost:5099
      NEXT_PUBLIC_API_URL: http://localhost:5099
      NEXT_PUBLIC_SITE_URL: https://staging.loja.exemplo.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Build (contra API stub)
        run: |
          node scripts/ci-api-stub.mjs &
          npm run build

      # SEO ≥ 95 e acessibilidade ≥ 90 bloqueiam; performance é aviso até termos o CDN de imagens (arquivo 16 §8).
      - name: Lighthouse CI (home, categoria, produto)
        run: |
          curl -sf http://localhost:5099/api/v1/catalog/categories > /dev/null || (node scripts/ci-api-stub.mjs &)
          npx --yes @lhci/cli@0.15.1 autorun

  # Em PR só constrói e verifica; na main publica no GHCR (pública) com os endereços do ambiente dev gravados no build.
  image:
    runs-on: ubuntu-latest
    needs: build
    # Os endereços vêm das variáveis do ambiente dev, que só a main alcança.
    environment: ${{ github.event_name == 'push' && 'dev' || '' }}
    permissions:
      contents: read
      packages: write
    outputs:
      web: ${{ steps.push.outputs.digest }}
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.STORE_URL || 'https://loja.exemplo.com' }}
      NEXT_PUBLIC_API_URL: ${{ vars.API_URL || 'https://api.loja.exemplo.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Nome da imagem
        id: names
        run: |
          echo "web=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ecommerce-web" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # No ambiente dev o bucket só existe na rede interna do Compose; o navegador recebe as fotos pelo next/image.
      - name: Build (para verificar)
        run: |
          docker buildx build --load -t scan/web \
            --build-arg NEXT_PUBLIC_SITE_URL --build-arg NEXT_PUBLIC_API_URL \
            --build-arg NEXT_PUBLIC_IMAGES_URL=http://rustfs:9000/mo-images --build-arg IMAGES_ALLOW_LOCAL_IP=true .

      # Barra vulnerabilidade crítica com correção disponível; altas só aparecem no log.
      - name: Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image --quiet \
            --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL scan/web
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image --quiet \
            --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 scan/web

      - if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name == 'push'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.names.outputs.web }}:${{ steps.names.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_IMAGES_URL=http://rustfs:9000/mo-images
            IMAGES_ALLOW_LOCAL_IP=true
          provenance: mode=max
          sbom: true

      - if: github.event_name == 'push'
        name: Resumo
        run: echo "### Imagem publicada"$'\n'"- \`${{ steps.names.outputs.web }}@${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  # Sobe a imagem publicada na VM do ambiente dev (entrega infra-1 do backend, I.3). O runner entra na rede privada só
  # durante o job, e a chave de deploy só consegue chamar o mo-deploy, que volta sozinho se a loja não ficar saudável.
  deploy:
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push'
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy na VM
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          WEB_DIGEST: ${{ needs.image.outputs.web }}
        # O host sai da própria linha do known_hosts. Tenta de novo só se a conexão falhar (255), nunca se o deploy falhar.
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          host=$(cut -d' ' -f1 ~/.ssh/known_hosts)
          for attempt in 1 2 3; do
            status=0
            ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 "deploy@$host" \
              web "$WEB_DIGEST" || status=$?
            [[ $status -ne 255 ]] && exit "$status"
            echo "Sem conexão com a VM (tentativa $attempt)"; sleep 10
          done
          exit 255

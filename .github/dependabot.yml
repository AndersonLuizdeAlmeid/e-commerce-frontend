# Atualizações semanais de dependências (arquivo 17 §1, entrega 6.2). Minor e patch vêm juntos num PR por ecossistema;
# major vem separado. Ações do GitHub continuam fixadas por SHA: o Dependabot troca o SHA e o comentário da versão.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    # O Node da imagem acompanha o do CI (node-version: 22). Trocar a versão maior é decisão, não atualização: o 26 entrou
    # sozinho em 20/11/2026 sem o CI rodar com ele.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
